name: Restore GitHub Pages (static recovery)

# Temporary recovery for the existing github.io URL. This deliberately publishes
# the last known static application, not the standalone server from the current tree.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/pages-recovery.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the last Pages-compatible application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ef0fc6112cd8047f69384aaff6970eba80ea7688
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:export
      - run: npm run test:preview
      - name: Require the generated application homepage
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const html = fs.readFileSync("out/index.html", "utf8");
          assert.ok(html.includes("/_next/static/"), "Pages must receive built application HTML");
          assert.ok(html.includes("<h1"), "The generated homepage must have its page heading");
          fs.writeFileSync("out/.nojekyll", "");
          NODE
      - name: Upload only the generated static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the static recovery artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4
